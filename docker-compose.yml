services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repay
      POSTGRES_PASSWORD: repay
      POSTGRES_DB: repay
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repay -d repay']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction обязателен для BullMQ: иначе при нехватке памяти задачи молча пропадут.
    # appendonly — переживаем рестарт без потери очередей.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
